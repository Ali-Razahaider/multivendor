<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312E81" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Subtle Accent Glow -->
  <circle cx="410" cy="100" r="140" fill="#818CF8" opacity="0.25" />
  <circle cx="100" cy="410" r="120" fill="#C084FC" opacity="0.2" />

  <!-- Shopping Bag Icon -->
  <g filter="url(#shadow)" transform="translate(106, 86)">
    <!-- Handles -->
    <path d="M100 130 C 100 65, 200 65, 200 130" 
          fill="none" stroke="url(#bagGrad)" stroke-width="28" stroke-linecap="round" />
    
    <!-- Bag Body -->
    <path d="M40 130 L 260 130 C 278 130, 292 145, 290 163 L 270 330 C 268 346, 254 358, 238 358 L 62 358 C 46 358, 32 346, 30 330 L 10 163 C 8 145, 22 130, 40 130 Z" 
          fill="url(#bagGrad)" />

    <!-- Sparkle / Badge Accent -->
    <circle cx="210" cy="240" r="28" fill="#10B981" />
    <path d="M202 240 L 208 246 L 220 234" 
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>