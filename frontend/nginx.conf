# frontend/nginx.conf
# Reverse proxy: serves the React app and forwards API/socket traffic
# to the backend container (service name "backend" = hostname in Docker network)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve React static files (fallback to index.html for client-side routes)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to the backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward socket.io (WebSocket upgrade headers are required!)
    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
